<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MELA Intervention Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: fixed left nav (pillars > interventions), working area on the right; sessions are the unit of work */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --sunk:#ECEEEA; --ink:#17201C; --muted:#5A6560; --line:#DCE0DA;
  --accent:#2F45A3; --accent-soft:#E6E9F7;
  --hent:#B8541A; --hent-soft:#F8E9DF; --hemp:#0D7279; --hemp-soft:#DDF0F1; --heco:#7A3C96; --heco-soft:#F0E5F5;
  --ok:#2C7A4B; --ok-soft:#E1F2E7; --warn:#A86A12; --warn-soft:#FAEFD9; --bad:#B03A2E; --bad-soft:#F8E3E0;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111514; --surface:#1A1F1D; --sunk:#151917; --ink:#E6EBE7; --muted:#9BA6A0; --line:#2C3431;
    --accent:#93A3FF; --accent-soft:#232A4A;
    --hent:#F0965E; --hent-soft:#3A2618; --hemp:#5CC5CB; --hemp-soft:#14302F; --heco:#C99AE0; --heco-soft:#2E2136;
    --ok:#6FCB92; --ok-soft:#173025; --warn:#E3B05A; --warn-soft:#332713; --bad:#EF8A7E; --bad-soft:#3A1E1B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111514; --surface:#1A1F1D; --sunk:#151917; --ink:#E6EBE7; --muted:#9BA6A0; --line:#2C3431;
  --accent:#93A3FF; --accent-soft:#232A4A;
  --hent:#F0965E; --hent-soft:#3A2618; --hemp:#5CC5CB; --hemp-soft:#14302F; --heco:#C99AE0; --heco-soft:#2E2136;
  --ok:#6FCB92; --ok-soft:#173025; --warn:#E3B05A; --warn-soft:#332713; --bad:#EF8A7E; --bad-soft:#3A1E1B;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100%}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px 30px;overflow-y:auto;height:100vh;position:sticky;top:0}
.brand{padding:4px 10px 16px;display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--display);font-size:20px;font-weight:600}
.brand span{font-size:12px;color:var(--muted)}
.navbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:14px}
.navbtn:hover{background:var(--sunk)}
.navbtn.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navbtn .count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pillhead{display:flex;align-items:center;gap:8px;padding:16px 10px 6px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.pillhead .pbar{width:4px;height:14px;border-radius:2px}
.tdot{width:7px;height:7px;border-radius:50%;flex:none;border:1.5px solid var(--muted)}
.tdot.sel{background:var(--muted)}
.addlink{background:none;border:0;color:var(--accent);font-size:13px;padding:5px 10px;cursor:pointer}
main{padding:26px 32px 60px;min-width:0}
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.crumbs button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px}
.head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.head p{margin:6px 0 0;color:var(--muted);max-width:68ch}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:7px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#111}}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.danger{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.c-HENT{background:var(--hent-soft);color:var(--hent)} .c-HEMP{background:var(--hemp-soft);color:var(--hemp)} .c-HECO{background:var(--heco-soft);color:var(--heco)}
.c-open{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.c-selective{background:var(--accent-soft);color:var(--accent)}
.st{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap}
.st-ok{background:var(--ok-soft);color:var(--ok)} .st-warn{background:var(--warn-soft);color:var(--warn)} .st-bad{background:var(--bad-soft);color:var(--bad)} .st-n{background:var(--sunk);color:var(--muted)} .st-a{background:var(--accent-soft);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.section{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.section > .row h2{margin-right:auto}
.kpi .n{font-family:var(--display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:13px;color:var(--muted)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--muted)}
.pipeline{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stage{padding:12px 16px;border-right:1px solid var(--line);position:relative}
.stage:last-child{border-right:0}
.stage .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.stage .v{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stage .s{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:22px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.formcard{display:flex;flex-direction:column;gap:10px}
.formcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.formcard .code{font-family:var(--mono);font-size:12px;color:var(--muted)}
.formcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
select.inline{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--surface);font-size:13px}
.attn{display:flex;flex-direction:column}
.attn button{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;cursor:pointer;width:100%}
.attn button:last-child{border-bottom:0}
.attn button:hover .t{color:var(--accent)}
.attn .ic{width:8px;height:8px;border-radius:50%;flex:none}
.pc{display:flex;flex-direction:column;gap:10px;border-top:4px solid}
.pc .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pc .stats div b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.pc .stats div span{font-size:12px;color:var(--muted)}
.daypills{display:flex;gap:6px;flex-wrap:wrap}
.daypill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.daypill.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.toggle{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;min-width:86px}
.toggle.on{background:var(--ok-soft);color:var(--ok);border-color:var(--ok);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.comment{border-left:3px solid var(--line);padding:4px 12px;margin:0}
.comment small{color:var(--muted);display:block}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.fbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
input.txt,select.txt,textarea.txt{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px}
textarea.txt{min-height:80px;resize:vertical}
.search{max-width:320px}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(10,14,12,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:20}
.ov.show{display:flex}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:620px;padding:22px 24px;border:1px solid var(--line);position:relative}
.modal.wide{max-width:820px}
.modal .x{position:absolute;right:12px;top:12px;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.modal h2{padding-right:30px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.fld > label,.fld > .lbl{font-weight:600;font-size:14px}
.fld .req{color:var(--bad)}
.fld .err{color:var(--bad);font-size:13px;min-height:0}
.opts{display:flex;flex-direction:column;gap:5px}
.opts label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:inline-block;min-width:36px;text-align:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-variant-numeric:tabular-nums}
.seg input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.pubhead{background:var(--sunk);border-radius:9px;padding:14px 16px;margin-top:6px}
.pubhead .row{gap:6px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:7px;padding:8px 12px;font-size:13px;margin-top:10px}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:9px;padding:16px;margin-top:12px}
.qrow{display:grid;grid-template-columns:1fr 150px auto;gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:8px}
.qrow.core{background:var(--sunk);grid-template-columns:1fr auto}
.qrow .qacts{display:flex;gap:2px}
.qrow .qacts button{background:none;border:1px solid var(--line);border-radius:5px;width:28px;height:30px;cursor:pointer;color:var(--muted)}
.qrow .full{grid-column:1/-1}
.qrow .reqc{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.qrbox{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:12px}
#qr{background:#fff;padding:10px;border-radius:8px;width:200px;height:200px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
.bulk{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:14px}
.journey{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.journey .j{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 18px;margin-top:10px;font-size:14px}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.ans{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.ans div span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.rub{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  nav.side{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}
  main{padding:20px 16px 50px}
  .pipeline{grid-auto-flow:row}
  .stage{border-right:0;border-bottom:1px solid var(--line)}
  .qrow{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="Pillars and interventions"></nav>
  <main id="main"></main>
</div>
<div class="ov" id="ov" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const TODAY='2026-10-30';
const LS='mela-proto-v3';
const PILLARS=['HENT','HEMP','HECO'];
const INTV={
  HENT:[['Ventures','selective'],['Venture Funding','selective'],['Masterclass','open'],['Hackathon','selective'],['Mentorship','selective'],['Exposure & Networking','open']],
  HEMP:[['Career Workshops','open'],['Exposure Events','open'],['Internships','selective'],['SIE','selective'],['Courses','open']],
  HECO:[['At a Glance','open'],['Public Sector Fellowship','selective'],['Health Expert in Residence Programme','selective'],['Research Activities','open'],['Public Sector Innovation Hackathon','selective'],['Executive Courses','selective'],['Impact Stories','open']]
};
const CORE=[
  {id:'name',label:'Full name',type:'text',req:true},
  {id:'email',label:'Email address',type:'email',req:true},
  {id:'phone',label:'Phone number',type:'text',req:true},
  {id:'gender',label:'Gender',type:'single',options:['Female','Male','Other','Prefer not to say'],req:true},
  {id:'age',label:'Age group',type:'single',options:['Under 18','18–24','25–34','35–44','45+'],req:true},
  {id:'country',label:'Country of residence',type:'text',req:true},
  {id:'affiliation',label:'Current affiliation',type:'single',options:['Student','Alumni','Founder / entrepreneur','Professional','Public servant','Other'],req:true},
  {id:'disability',label:'Do you identify as a person with a disability?',type:'single',options:['Yes','No','Prefer not to say'],req:true},
  {id:'consent',label:'I consent to my information being used to run this programme and for monitoring, evaluation and learning.',type:'consent',req:true}
];
const FB_CORE=[
  {id:'email',label:'Email you registered with',type:'email',req:true},
  {id:'sat',label:'Overall, how satisfied are you with this session?',type:'rating',req:true},
  {id:'rel',label:'How relevant was the content to your goals?',type:'rating',req:true},
  {id:'nps',label:'How likely are you to recommend this to a friend or colleague?',type:'scale10',req:true},
  {id:'learn',label:'What is the most useful thing you took away?',type:'long'},
  {id:'improve',label:'What should we improve next time?',type:'long'}
];
const QTYPES={text:'Short answer',long:'Paragraph',email:'Email',number:'Number',date:'Date',single:'Single choice',multi:'Multiple choice',rating:'Rating 1–5',scale10:'Scale 0–10',yesno:'Yes / No'};
const ST_OPEN={registered:['Registered','st-ok'],waitlisted:['Waitlisted','st-warn'],cancelled:['Cancelled','st-n']};
const ST_SEL={applied:['To review','st-a'],shortlisted:['Shortlisted','st-warn'],selected:['Selected','st-ok'],waitlisted:['Waitlisted','st-warn'],rejected:['Not selected','st-bad'],withdrawn:['Withdrawn','st-n']};
const FSTAT={draft:['Draft','st-n'],open:['Open','st-ok'],closed:['Closed','st-bad']};

let S=null;
let V={name:'home'};
let ED=null;

/* ---------- utils ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
function fmtD(d){if(!d)return '';const x=new Date(d+'T00:00:00');return x.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function fmtShort(d){const x=new Date(d+'T00:00:00');return x.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function fmtRange(ds){if(!ds||!ds.length)return 'No dates set';if(ds.length===1)return fmtD(ds[0]);return fmtShort(ds[0])+' – '+fmtD(ds[ds.length-1])+' · '+ds.length+' dates'}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(LS);if(r)return JSON.parse(r)}catch(e){}return null}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
function q(label,type,options,req){return {id:uid('q'),label,type,options:options||[],req:!!req}}
const intv=id=>S.interventions.find(x=>x.id===id);
const ses=id=>S.sessions.find(x=>x.id===id);
const person=pid=>S.people.find(x=>x.pid===pid);
const abbr=n=>n.replace(/&/g,'').split(/\s+/).filter(Boolean).map(w=>w[0]).join('').toUpperCase().slice(0,4);

function sesStatus(s){const d=[...s.dates].sort();if(!d.length)return ['Not scheduled','st-n'];if(d[d.length-1]<TODAY)return ['Completed','st-n'];if(d[0]>TODAY)return ['Upcoming','st-a'];return ['In progress','st-ok']}
function stMap(s){return s.kind==='application'?ST_SEL:ST_OPEN}
function eligible(s,e){return s.kind==='application'?e.status==='selected':e.status==='registered'}
function stats(s){
  const en=S.entries.filter(e=>e.sid===s.id);
  const el=en.filter(e=>eligible(s,e));
  const at=S.att.filter(a=>a.sid===s.id);
  const attendees=new Set(at.map(a=>a.pid));
  const fb=S.fb.filter(f=>f.sid===s.id);
  return {intake:en.length,eligible:el.length,toReview:en.filter(e=>e.status==='applied').length,shortlisted:en.filter(e=>e.status==='shortlisted').length,attendees:attendees.size,marks:at.length,fb:fb.length,en,el,at,fbl:fb};
}

/* ---------- model ---------- */
function defaultCustom(p,kind){
  const P={
    HENT:[q('Venture name (if any)','text'),q('Venture stage','single',['Idea','Prototype / MVP','Early revenue','Scaling'])],
    HEMP:[q('Field of study or career interest','text'),q('Current employment status','single',['Studying','Employed','Self-employed','Looking for work'])],
    HECO:[q('Organisation or institution','text'),q('Current role or position','text')]
  }[p];
  if(kind==='application')return [...P,q('Why do you want to join this programme?','long',null,true),q('What do you hope to achieve by the end?','long',null,true),q('Link to CV or portfolio','text')];
  return [...P,q('How did you hear about this session?','single',['Social media','Email','Friend or colleague','Campus or office notice','Other'])];
}
function defaultFbCustom(p){
  return [{HENT:q('How confident do you feel applying this to your venture?','rating',null,true),HEMP:q('How much did this improve your career readiness?','rating',null,true),HECO:q('How applicable is this to your work in the public or health sector?','rating',null,true)}[p]];
}
const DEFAULT_RUBRIC=()=>[{id:uid('r'),name:'Motivation and commitment',weight:30},{id:uid('r'),name:'Fit with eligibility criteria',weight:30},{id:uid('r'),name:'Potential for impact',weight:40}];

function newSession(i,d,copyFrom){
  S.seq.s++;
  const n=String(S.seq.s).padStart(3,'0');
  const base=`${i.pillar}-${abbr(i.name)}-${n}`;

function attention(){
  const out=[];
  for(const s of S.sessions){const i=intv(s.iid);const st=stats(s);
    if(st.toReview)out.push({c:'var(--accent)',t:`${st.toReview} application${st.toReview>1?'s':''} waiting for review`,d:`${i.name} · ${s.title}`,id:s.id,tab:'people'});
    const past=s.dates.filter(d=>d<TODAY);

}

function readSes(form){

  const dates=d.dates.split(/[,\s]+/).filter(Boolean);
  if(!dates.length||dates.some(x=>!/^\d{4}-\d{2}-\d{2}$/.test(x)||isNaN(new Date(x)))){form.querySelector('#d-dates').parentElement.querySelector('.err').textContent='Enter dates as YYYY-MM-DD, separated by commas.';ok=false}
  d.dates=[...new Set(dates)].sort();d.title=d.title.trim();d.capacity=d.capacity?Number(d.capacity):'';
  return ok?d:null;
}

function fieldHTML(qq){

    case 'multi':inp=`<div class="opts">${qq.options.map(x=>`<label><input type="checkbox" name="${id}" value="${esc(x)}"> ${esc(x)}</label>`).join('')}</div>`;break;
    case 'rating':inp=`<div class="seg" role="radiogroup">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="${id}" value="${n}"><span>${n}</span></label>`).join('')}<span class="muted" style="font-size:12px;align-self:center;margin-left:6px">1 = poor, 5 = excellent</span></div>`;break;
    case 'scale10':inp=`<div class="seg" role="radiogroup">${[...Array(11).keys()].map(n=>`<label><input type="radio" name="${id}" value="${n}"><span>${n}</span></label>`).join('')}</div>`;break;
    case 'consent':return `<div class="fld" data-q="${qq.id}"><label class="opts" style="font-weight:400"><span style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" name="${id}" value="yes" style="margin-top:4px"> <span>${esc(qq.label)}${r}</span></span></label><div class="err"></div></div>`;
    case 'select':inp=`<select class="txt" id="${id}" name="${id}">${qq.options.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select>`;break;
    default:inp=`<input class="txt" id="${id}" name="${id}" type="text">`;
  }
  const lab=['single','yesno','multi','rating','scale10'].includes(qq.type)?`<span class="lbl">${esc(qq.label)}${r}</span>`:`<label for="${id}">${esc(qq.label)}${r}</label>`;

  ${mode==='staff'||mode==='walkin'?`<div class="notice" style="background:var(--accent-soft);color:var(--accent)">${mode==='walkin'?`Staff entry: registers a walk-in and marks them present for ${fmtD(V.day||s.dates[0])}.`:'Staff entry: adding on behalf of a participant.'}</div>`:f.status!=='open'?`<div class="notice">Participants would see “not accepting responses” because this form is ${FSTAT[f.status][0].toLowerCase()}. You can still test it here.</div>`:''}
  <form id="pubf" data-id="${s.id}" data-k="${k}" data-mode="${mode||''}" novalidate>${body}<div id="formerr" class="err" style="color:var(--bad);margin-top:12px"></div><div class="mfoot"><button class="btn" type="button" data-a="close">Cancel</button><button class="btn pri" type="submit">Submit</button></div></form>`);
  if(k==='attendance'){const sel=document.getElementById('f_day');const qd=qs[1];sel.innerHTML=qd._dates.map(d=>`<option value="${d}"${d===qd._def?' selected':''}>${fmtD(d)}</option>`).join('')}
}
function collect(form,qs){
  const fd=new FormData(form);const v={};let ok=true;
  for(const qq of qs){const n='f_'+qq.id;const box=form.querySelector(`[data-q="${qq.id}"] .err`);if(box)box.textContent='';
    let val=qq.type==='multi'?fd.getAll(n):(fd.get(n)??'');if(typeof val==='string')val=val.trim();
    const empty=Array.isArray(val)?!val.length:val==='';
    if(qq.req&&empty){ok=false;if(box)box.textContent=qq.type==='consent'?'Consent is needed to continue.':'This question is required.';continue}
    if(qq.type==='email'&&!empty&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val)){ok=false;if(box)box.textContent='Enter a valid email address.';continue}
    if(['rating','scale10','number'].includes(qq.type)&&!empty)val=Number(val);
    v[qq.id]=val;}
  return ok?v:null;
}
function submitPub(form){
  const s=ses(form.dataset.id);const k=form.dataset.k;const mode=form.dataset.mode;const qs=formQs(s,k);
  const v=collect(form,qs);const fe=document.getElementById('formerr');fe.textContent='';
  if(!v){fe.textContent='Some answers need attention.';return}
  const email=String(v.email).toLowerCase();let p=S.people.find(x=>x.email===email);
  let msg='';
  if(k==='intake'){
    const prof={};for(const c of CORE)if(c.id!=='consent')prof[c.id]=v[c.id];
    let returning=!!p;
    if(p&&S.entries.some(e=>e.sid===s.id&&e.pid===p.pid)){fe.textContent=`${p.email} has already ${s.kind==='application'?'applied':'registered'} for this session (${p.pid}).`;return}
    if(p)Object.assign(p,{...prof,email});else p=addPerson(prof);
    const ans={};for(const qq of s.forms.intake.questions)ans[qq.id]=v[qq.id];
    let status='applied';
    if(s.kind==='registration'){const n=S.entries.filter(e=>e.sid===s.id&&e.status==='registered').length;status=s.capacity&&n>=s.capacity?'waitlisted':'registered'}
    S.entries.push({id:uid('e'),sid:s.id,pid:p.pid,status,submitted:TODAY,answers:ans,scores:null});
    if(mode==='walkin'){const d=V.day||s.dates[0];if(status!=='registered'){S.entries[S.entries.length-1].status='registered'}S.att.push({sid:s.id,pid:p.pid,day:d,at:d+'T'+new Date().toTimeString().slice(0,5)})}
    msg=`<b>${s.kind==='application'?'Application received.':status==='waitlisted'?'Added to the waitlist: the session is full.':'You are registered.'}</b><br>Participant ID <span class="mono">${p.pid}</span> · ${returning?'Matched to an existing participant record by email, so no duplicate was created.':'New participant record created in the registry.'}${mode==='walkin'?'<br>Marked present.':''}`;
  }else if(k==='attendance'){
    if(!p){fe.textContent='No participant found with that email. Register first, or ask staff to add you as a walk-in.';return}
    const e=S.entries.find(x=>x.sid===s.id&&x.pid===p.pid);
    if(!e||!eligible(s,e)){fe.textContent=s.kind==='application'?'This email is not on the list of selected participants for this session.':'This email is not registered for this session. Ask staff to add you as a walk-in.';return}
    if(S.att.some(a=>a.sid===s.id&&a.pid===p.pid&&a.day===v.day)){fe.textContent=`${p.name} is already checked in for ${fmtD(v.day)}.`;return}
    S.att.push({sid:s.id,pid:p.pid,day:v.day,at:v.day+'T'+new Date().toTimeString().slice(0,5)});
    msg=`<b>Checked in. Welcome, ${esc(p.name.split(' ')[0])}!</b><br>${fmtD(v.day)} · <span class="mono">${p.pid}</span>`;
  }else{
    if(!p){fe.textContent='No participant found with that email.';return}
    if(!S.att.some(a=>a.sid===s.id&&a.pid===p.pid)){fe.textContent='We have no attendance record for this email at this session, so feedback is not linked. Check the email used to register.';return}
    if(S.fb.some(f=>f.sid===s.id&&f.pid===p.pid)){fe.textContent='Feedback from this participant has already been recorded for this session.';return}
    const ans={};for(const qq of s.forms.feedback.questions)ans[qq.id]=v[qq.id];
    S.fb.push({sid:s.id,pid:p.pid,at:TODAY,sat:v.sat,rel:v.rel,nps:v.nps,learn:v.learn||'',improve:v.improve||'',answers:ans});
    msg='<b>Thank you for your feedback.</b><br>Your response is linked to your attendance record.';
  }
  save();render();
  modal(`<h2>Submitted</h2><div class="okbox">${msg}</div><div class="mfoot"><button class="btn" data-a="fill" data-id="${s.id}" data-k="${k}" data-mode="${mode}">Submit another</button><button class="btn pri" data-a="close">Done</button></div>`);
}

  if(t.dataset.qi!=null&&ED){const it=ED.qs[+t.dataset.qi];const f=t.dataset.f;if(f==='label'||f==='name')it[f]=t.value;else if(f==='weight'){it.weight=t.value;const tw=document.getElementById('tw');if(tw)tw.textContent='Total: '+ED.qs.reduce((a,r)=>a+(Number(r.weight)||0),0)+'%'}else if(f==='options')it.options=t.value.split('\n').map(x=>x.trim())}
  if(t.dataset.c==='regq')filterReg(t.value);
});
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target;
  if(f.id==='pubf')submitPub(f);
  else if(f.id==='newf'){const d=readSes(f);if(!d)return;const i=intv(d.iid);const s=newSession(i,d,d.copy||null);save();V={name:'session',id:s.id,tab:'forms'};closeModal();render();toast('Session created with its forms')}
  else if(f.id==='detf'){const d=readSes(f);if(!d)return;const s=ses(f.dataset.id);Object.assign(s,{title:d.title,dates:d.dates,mode:d.mode,venue:d.venue,facilitator:d.facilitator,capacity:d.capacity,deadline:d.deadline||s.deadline});save();render();toast('Session saved')}
  else if(f.id==='intf'){const n=f.querySelector('#i-name').value.trim();if(!n){f.querySelector('.err').textContent='Enter a name.';return}const i={id:uid('i'),pillar:f.dataset.p,name:n,type:new FormData(f).get('type')};S.interventions.push(i);save();V={name:'intervention',id:i.id};closeModal();render()}
});

/* ---------- boot ---------- */
S=load();if(!S||!S.sessions){seed();save()}
try{const v=JSON.parse(localStorage.getItem(LS+'-v')||'null');if(v&&v.name)V=v}catch(e){}
render();
</script>
